[package]
name = "cand-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish = false
description = "socketcand-compatible CAN bridge: exposes any supported CAN backend (Vector XL-API, Linux SocketCAN, mock) over the network for the Classic Diagnostic Adapter's can-socketcand transport"

[[bin]]
name = "cand-relay"
path = "src/main.rs"

[features]
default = ["mock"]
mock = ["dep:cand-relay-backend-mock"]
socketcan = ["dep:cand-relay-backend-socketcan"]
vector-windows = ["dep:cand-relay-backend-vector", "cand-relay-backend-vector/windows"]
vector-linux = ["dep:cand-relay-backend-vector", "cand-relay-backend-vector/linux"]

[dependencies]
cand-relay-core.workspace = true
cand-relay-backend-mock = { workspace = true, optional = true }
cand-relay-backend-socketcan = { workspace = true, optional = true }
cand-relay-backend-vector = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
clap = { workspace = true, features = ["derive"] }
anyhow.workspace = true

[lints]
workspace = true
