default_stages:
  - pre-commit
  - manual
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: make-lint-all-features
        name: make lint-nightly-all-features (SDK-free backends)
        stages: [manual]
        groups: [CI]
        entry: make lint-nightly-all-features
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.(patch|diff)$'
      - id: mixed-line-ending
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # Excluded because it contains literal Unicode banner-fill characters in
        # the no-banner-comment-check args; yamlfmt would otherwise reformat them.
        exclude: ^\.pre-commit-config\.yaml$
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint-docker
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/eclipse-opensovd/cicd-workflows
    rev: 07140bdd84f20b66fd4aff58a83c5148deec388c
    hooks:
      - id: reuse-annotate
        args:
          - --copyright=Copyright (c) Contributors to cand-relay
          - --license=Apache-2.0
          - --template=opensovd
      - id: no-unicode-check
        # Excluded because it contains literal Unicode banner-fill characters in
        # the no-banner-comment-check args below.
        exclude: ^\.pre-commit-config\.yaml$
        args:
          - --allowed-chars=µ,§
      - id: no-banner-comment-check
        files: '\.(rs|py|toml|yml|yaml|c|h|kt|kts|sh|proto|fbs|puml|json|xml|js)$|^Dockerfile$'
        args:
          - "--banner-chars==-#*/~_+—–―─━═"
          - --min-length=4
      - id: validate-cargo-lints
      - id: cargo-fmt
        name: make fmt-check
        entry: make fmt-check
        language: system
        pass_filenames: false
        always_run: true
        args: []
      - id: clippy
        name: make lint-nightly
        entry: make lint-nightly
        language: system
        pass_filenames: false
        always_run: true
        args: []
      - id: check-hooks

  - repo: local
    hooks:
      - id: no-typography-in-comments
        name: no typography in comments
        entry: python3 scripts/no-typography-in-comments.py
        language: system
        files: '\.(rs|py|toml|yml|yaml|c|h|kt|kts|sh|proto|fbs|puml|json|xml|js)$|^Dockerfile$'
