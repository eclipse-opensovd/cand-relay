[package]
name = "cand-relay-core"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish = false
description = "Backend-agnostic socketcand-compatible CAN relay server used by cand-relay"

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
cand-relay-backend-mock.workspace = true

[lints]
workspace = true
